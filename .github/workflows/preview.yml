# Every push to main (or a test-* branch) that changes the app runs the tests (Linux and Windows),
# builds the AppImages and the Windows .exes (Intel/AMD and ARM each), and puts them in a draft
# release: "Preview build" for main, "Preview build (<branch>)" for a test branch. Only people with
# write access can see drafts.
# Nothing is published; releasing is a separate, deliberate step: the Release workflow.
name: Preview build

on:
  push:
    branches: [main, "test-*"]
    paths:
      - "sc_hammer/**"
      - "packaging/**"
      - "tests/**"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test (demo devices, then the real device code with nothing plugged in)
        run: |
          python -m sc_hammer --demo --list
          python -m sc_hammer --list

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          base=$(python3 -c "import sc_hammer; print(sc_hammer.__version__)")
          echo "version=${base}-preview.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    needs: [test, version]
    # Each AppImage is built and smoke-tested on its own architecture.
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: Install squashfs-tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Build the AppImage
        run: packaging/build-appimage.sh
      - name: Smoke test the AppImage
        # no FUSE on the runner, so let it unpack itself
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/SC-Hammer-$ARCH.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/SC-Hammer-$ARCH.AppImage --demo --list | tee out.txt
          grep -q "Steam Controller Puck" out.txt
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*.AppImage

  windows:
    needs: [test, version]
    # Each .exe is built by a native Python on its own architecture: PyInstaller
    # can't cross-build.
    strategy:
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EXE: dist/SC-Hammer-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Build the .exe
        run: |
          python -m pip install pyinstaller
          python packaging/build_windows.py
      - name: Smoke test the .exe
        run: |
          ./$EXE --demo --list | tee out.txt
          grep -q "Steam Controller Puck" out.txt
          ./$EXE --diagnose | tee diag.txt
          grep -q "Raw HID collections" diag.txt
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.exe

  publish:
    needs: [linux, windows, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Name the draft after the branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = main ]; then
            echo "TITLE=Preview build" >> "$GITHUB_ENV"; echo "TAG=preview" >> "$GITHUB_ENV"
          else
            echo "TITLE=Preview build ($BRANCH)" >> "$GITHUB_ENV"
            echo "TAG=preview-$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_ENV"
          fi
      - name: Write the notes
        run: |
          python3 .github/scripts/release_notes.py --preview --branch "${{ github.ref_name }}" \
            --version "$VERSION" \
            --asset "dist/SC-Hammer-x86_64.AppImage" \
            --asset "dist/SC-Hammer-aarch64.AppImage" \
            --asset "dist/SC-Hammer-$VERSION-windows-x64.exe" \
            --asset "dist/SC-Hammer-$VERSION-windows-arm64.exe" > notes.md
      - name: Replace this branch's preview draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isDraft,name \
            --jq ".[] | select(.isDraft and .name == \"$TITLE\") | .tagName" \
            | while read -r tag; do gh release delete "$tag" --yes; done
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file notes.md "dist/SC-Hammer-x86_64.AppImage" \
            "dist/SC-Hammer-aarch64.AppImage" "dist/SC-Hammer-$VERSION-windows-x64.exe" \
            "dist/SC-Hammer-$VERSION-windows-arm64.exe"
