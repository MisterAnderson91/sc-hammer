# Publishes a release when you ask for one: Actions → Release → Run workflow (or from a terminal:
# gh workflow run release.yml -f bump=minor -f highlights="First point; second point").
# Runs the tests, builds the AppImages and the Windows .exes (Intel/AMD and ARM each) from main,
# tags vX.Y.Z, writes the notes and removes the preview draft.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump since the last release"
        type: choice
        options: [patch, minor, major]
        default: patch
      highlights:
        description: "Highlights for the notes (optional; separate points with ;)"
        type: string
        required: false

concurrency:
  group: release

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run the tests
        run: python -m unittest discover -s tests -v

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prev: ${{ steps.v.outputs.prev }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$prev" ]; then
            # First release: use the version in the code as-is.
            version=$(python3 -c "import sc_hammer; print(sc_hammer.__version__)")
          else
            version=$(python3 - "$prev" "$BUMP" <<'PY'
          import sys
          major, minor, patch = (int(x) for x in sys.argv[1].lstrip("v").split("-")[0].split("."))
          bump = sys.argv[2]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          print("%d.%d.%d" % (major, minor, patch))
          PY
          )
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (previous: ${prev:-none})"

  linux:
    needs: [test, version]
    # Each AppImage is built and smoke-tested on its own architecture.
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - name: Install squashfs-tools
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools
      - name: Build the AppImage
        run: packaging/build-appimage.sh
      - name: Smoke test the AppImage
        # no FUSE on the runner, so let it unpack itself
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/SC-Hammer-$ARCH.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/SC-Hammer-$ARCH.AppImage --demo --list | tee out.txt
          grep -q "Steam Controller Puck" out.txt
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/*.AppImage

  windows:
    needs: [test, version]
    # Each .exe is built by a native Python on its own architecture: PyInstaller
    # can't cross-build.
    strategy:
      matrix:
        include:
          - { runner: windows-latest, arch: x64 }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EXE: dist/SC-Hammer-${{ needs.version.outputs.version }}-windows-${{ matrix.arch }}.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Build the .exe
        run: |
          python -m pip install pyinstaller
          python packaging/build_windows.py
      - name: Smoke test the .exe
        run: |
          ./$EXE --demo --list | tee out.txt
          grep -q "Steam Controller Puck" out.txt
          ./$EXE --diagnose | tee diag.txt
          grep -q "Raw HID collections" diag.txt
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.exe

  publish:
    needs: [linux, windows, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PREV_TAG: ${{ needs.version.outputs.prev }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write the notes
        env:
          HIGHLIGHTS: ${{ inputs.highlights }}
          GH_TOKEN: ${{ github.token }}  # to fetch the earlier releases' notes
        run: |
          python3 .github/scripts/release_notes.py --version "$VERSION" ${PREV_TAG:+--prev-tag "$PREV_TAG"} \
            --highlights "$HIGHLIGHTS" \
            --asset "dist/SC-Hammer-x86_64.AppImage" \
            --asset "dist/SC-Hammer-aarch64.AppImage" \
            --asset "dist/SC-Hammer-$VERSION-windows-x64.exe" \
            --asset "dist/SC-Hammer-$VERSION-windows-arm64.exe" > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "SC Hammer $VERSION" \
            --notes-file notes.md "dist/SC-Hammer-x86_64.AppImage" \
            "dist/SC-Hammer-aarch64.AppImage" "dist/SC-Hammer-$VERSION-windows-x64.exe" \
            "dist/SC-Hammer-$VERSION-windows-arm64.exe"
          gh release list --limit 100 --json tagName,isDraft,name \
            --jq '.[] | select(.isDraft and .name == "Preview build") | .tagName' \
            | while read -r tag; do gh release delete "$tag" --yes; done
